events {
    worker_connections 1024;
}

http {
    # Upstream backend pool for horizontal scaling
    upstream finflow_backend {
        # Round-robin distribution across containerized Node instances
        server api-1:5000;
        server api-2:5000;
    }

    server {
        listen 5000;

        location / {
            proxy_pass http://finflow_backend;

            # Forward standard proxy headers so Express rate limiting & trust proxy work accurately
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support for Server-Sent Events (SSE) live notifications without buffering
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
